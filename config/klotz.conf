# Uncomment these two line to add support for encoders to your firmware
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BACKLIGHT=n
#CONFIG_ZMK_BACKLIGHT_BRT_START=10

# GPIO활성화
CONFIG_GPIO=y

# LED 인디케이터 활성화 (레이어 상태 표시용)
# CONFIG_ZMK_LED_INDICATOR=y

# 윈도우 연결 안정성 개선 (어제 논의한 내용)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

CONFIG_ZMK_SPLIT=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Changes 30,000 milliseconds default idle timeout to
# 120,000 milliseconds or 2 minutes.
CONFIG_ZMK_IDLE_TIMEOUT=120000

# Enable passkey entry during paring for enhanced security
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

CONFIG_ZMK_BLE=y

CONFIG_ZMK_MOUSE=y

# 배터리 모니터링
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
